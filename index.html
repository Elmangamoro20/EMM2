<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Título solicitado -->
    <title>emm2.www</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: #000; color: #fff; font-family: sans-serif; overflow-x: hidden; }
        .page { padding: 20px; display: none; height: 100vh; width: 100vw; position: absolute; top: 0; left: 0; }
        #inicio { display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .btn { background: #fff; color: #000; padding: 15px 40px; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; font-size: 16px; text-transform: uppercase; }
        #catalogo { overflow-y: auto; height: 100vh; }
        
        .grid-catalogo { 
            display: grid; 
            gap: 20px; 
            grid-template-columns: repeat(3, 1fr); 
            max-width: 900px; 
            margin: 60px auto 20px auto; 
            padding: 0 20px;
        }
        
        @media (max-width: 600px) {
            .grid-catalogo { grid-template-columns: 1fr; }
        }
        
        .item { aspect-ratio: 3/4; border: 2px solid #fff; border-radius: 10px; overflow: hidden; cursor: pointer; position: relative; }
        .item img { width: 100%; height: 100%; object-fit: cover; }
        .label { position: absolute; top: 10px; left: 10px; padding: 4px 12px; border: 1.5px solid #fff; border-radius: 6px; font-size: 1rem; font-weight: bold; background: rgba(0,0,0,0.6); z-index: 2; pointer-events: none; }
        
        .tiktok-container { width: 100vw; height: 100vh; overflow: hidden; position: relative; }
        .tiktok-slider { display: flex; width: 300vw; height: 100vh; transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        .slider-item { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .slider-item img { width: 100%; height: 100%; object-fit: contain; background: #000; }
        
        .dots { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 10; pointer-events: none; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.3); }
        .dot.active { background: #fff; }
        .volver { position: absolute; top: 20px; left: 20px; z-index: 20; cursor: pointer; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 20px; border: 1px solid #fff; }
        .wp { position: fixed; bottom: 30px; right: 20px; z-index: 100; text-decoration: none; text-align: center; }
        .wp img { width: 50px; }
        .wp p { font-size: 12px; color: #25d366; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>
    <section id="inicio" class="page" style="display: flex;">
        <h1>emm2.www</h1>
        <button class="btn" onclick="irA('catalogo')">ENTRAR</button>
    </section>
    <section id="catalogo" class="page">
        <div class="volver" onclick="irA('inicio')">← Volver</div>
        <div class="grid-catalogo">
            <div class="item" onclick="abrirDetalle('estilo1')"><div class="label">V1</div><img src="estilo1_1.jpg.jpeg"></div>
            <div class="item" onclick="abrirDetalle('estilo2')"><div class="label">V2</div><img src="estilo2_1.jpg.jpeg"></div>
            <div class="item" onclick="abrirDetalle('estilo3')"><div class="label">V3</div><img src="estilo3_1.jpg.jpeg"></div>
            <div class="item" onclick="abrirDetalle('estilo4')"><div class="label">V4</div><img src="estilo4_1.jpg.jpeg"></div>
            <div class="item" onclick="abrirDetalle('estilo5')"><div class="label">V5</div><img src="estilo5_1.jpg.jpeg"></div>
            <div class="item" onclick="abrirDetalle('estilo6')"><div class="label">V6</div><img src="estilo6_1.jpg.jpeg"></div>
        </div>
    </section>
    <section id="detalle" class="page" style="padding:0;">
        <div class="volver" onclick="irA('catalogo')">← Volver</div>
        <div class="tiktok-container">
            <div class="tiktok-slider" id="slider"></div>
        </div>
        <div class="dots" id="dots"></div>
    </section>
    <a href="https://wa.me/5491162669735" class="wp" target="_blank"><img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp"><p>1162669735</p></a>

    <script>
        let currentIndex = 0;
        function irA(id) {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById(id).style.display = (id === 'inicio' ? 'flex' : 'block');
        }
        function abrirDetalle(estilo) {
            currentIndex = 0;
            const slider = document.getElementById('slider');
            const dots = document.getElementById('dots');
            slider.innerHTML = ''; dots.innerHTML = '';
            for (let i = 1; i <= 3; i++) {
                slider.innerHTML += `<div class="slider-item"><img src="${estilo}_${i}.jpg.jpeg"></div>`;
                dots.innerHTML += `<div class="dot ${i===1 ? 'active' : ''}"></div>`;
            }
            irA('detalle');
            slider.style.transform = `translateX(0vw)`;
        }
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('detalle').style.display === 'block') {
                if (e.key === 'ArrowRight' && currentIndex < 2) { currentIndex++; updatePos(); }
                else if (e.key === 'ArrowLeft' && currentIndex > 0) { currentIndex--; updatePos(); }
            }
        });
        function updatePos() {
            document.getElementById('slider').style.transform = `translateX(-${currentIndex * 100}vw)`;
            document.querySelectorAll('.dot').forEach((d, i) => d.className = i === currentIndex ? 'dot active' : 'dot');
        }
    </script>
</body>
</html>
