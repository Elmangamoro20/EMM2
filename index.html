<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMM2</title>
    <!-- Incluimos Matter.js para las físicas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        .page { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; display: none; }
        
        /* Contenedor del motor de físicas */
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; }
        
        #inicio { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        /* ... resto de tus estilos (btn, h1, etc) siguen igual ... */
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <section id="inicio" class="page" style="display: flex;">
        <h1>EMM2</h1>
        <p>Remeras blancas 100% algodón...</p>
        <button class="btn" onclick="irA('catalogo')">ENTRAR</button>
    </section>

    <script>
        // Motor de físicas
        const { Engine, Render, World, Bodies, Body } = Matter;
        const engine = Engine.create();
        const render = Render.create({
            element: document.getElementById('canvas-container'),
            engine: engine,
            options: { width: window.innerWidth, height: window.innerHeight, background: 'transparent', wireframes: false }
        });

        // Crear paredes invisibles para que no salgan de la pantalla
        const wallOptions = { isStatic: true, render: { visible: false } };
        World.add(engine.world, [
            Bodies.rectangle(window.innerWidth/2, -10, window.innerWidth, 20, wallOptions),
            Bodies.rectangle(window.innerWidth/2, window.innerHeight+10, window.innerWidth, 20, wallOptions),
            Bodies.rectangle(-10, window.innerHeight/2, 20, window.innerHeight, wallOptions),
            Bodies.rectangle(window.innerWidth+10, window.innerHeight/2, 20, window.innerHeight, wallOptions)
        ]);

        // Crear remeras con rebote
        for(let i=0; i<4; i++) {
            let remera = Bodies.circle(Math.random()*window.innerWidth, Math.random()*window.innerHeight, 70, {
                restitution: 1, // Rebote total
                render: { sprite: { texture: i%2==0 ? 'remera_fondo1.png' : 'remera_fondo2.png', xScale: 0.5, yScale: 0.5 } }
            });
            Body.setVelocity(remera, {x: Math.random()*10-5, y: Math.random()*10-5});
            World.add(engine.world, remera);
        }

        Engine.run(engine);
        Render.run(render);
    </script>
</body>
</html>
