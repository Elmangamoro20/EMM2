<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EMM2</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        .page { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; display: none; }
        
        #inicio { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
        h1 { font-size: 3rem; margin-bottom: 20px; letter-spacing: 2px; }
        .btn-container { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 300px; }
        .row-group { display: flex; gap: 10px; align-items: center; }
        .btn { flex-grow: 1; background: #fff; color: #000; padding: 15px; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        .btn-outline { background: transparent; color: #fff; border: 1px solid #fff; }
        .btn-info { width: 45px; height: 45px; border-radius: 50%; border: 1px solid #fff; background: transparent; color: #fff; cursor: pointer; font-weight: bold; }
        
        .page-list { overflow-y: auto; display: none; padding-top: 60px; padding-bottom: 40px; }
        .grid { display: grid; gap: 15px; max-width: 900px; margin: 0 auto; padding: 15px; grid-template-columns: repeat(2, 1fr); }
        .item { aspect-ratio: 1/1; border: 2px solid #fff; border-radius: 10px; overflow: hidden; position: relative; cursor: pointer; }
        .item img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Etiquetas mejoradas */
        .tag-v { position: absolute; top: 5px; left: 5px; background: #fff; color: #000; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .tag-price { position: absolute; bottom: 5px; right: 5px; background: #000; border: 1px solid #fff; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
        .tag-logo { position: absolute; bottom: 5px; left: 5px; background: rgba(0,0,0,0.6); padding: 2px 8px; border-radius: 4px; font-size: 10px; }
        
        /* Swiper Corregido para Móvil */
        .swiper { width: 100vw; height: 100vh; background: #000; }
        .swiper-slide { display: flex; justify-content: center; align-items: center; }
        .swiper-slide img { max-width: 90%; max-height: 80%; object-fit: contain; }
        .swiper-pagination { bottom: 40px !important; z-index: 100 !important; }
        .swiper-pagination-bullet { width: 12px !important; height: 12px !important; background: #fff !important; opacity: 0.5 !important; }
        .swiper-pagination-bullet-active { opacity: 1 !important; transform: scale(1.3); }
        
        .volver { position: absolute; top: 20px; left: 20px; z-index: 1000; cursor: pointer; background: rgba(0,0,0,0.7); padding: 10px; border: 1px solid #fff; border-radius: 10px; }
    </style>
</head>
<body>
    <section id="inicio" class="page" style="display: flex;">
        <h1>EMM2</h1>
        <div class="btn-container">
            <div class="row-group"><button class="btn" onclick="irA('catalogo')">MODELOS</button><button class="btn-info" onclick="irA('info-modelos')">?</button></div>
            <div class="row-group"><button class="btn btn-outline" onclick="irA('stock')">REMERA</button><button class="btn-info" onclick="irA('info-remera')">?</button></div>
        </div>
    </section>

    <!-- Info -->
    <section id="info-modelos" class="page page-list"><div class="volver" onclick="irA('inicio')">← Volver</div><div style="padding:20px"><p>Los modelos son ilustraciones para visualizar diseños.</p></div></section>
    <section id="info-remera" class="page page-list"><div class="volver" onclick="irA('inicio')">← Volver</div><div style="padding:20px"><p>Remera básica: sin logo, sin etiqueta.</p></div></section>

    <!-- Catálogo Modelos -->
    <section id="catalogo" class="page page-list">
        <div class="volver" onclick="irA('inicio')">← Volver</div>
        <div class="grid">
            <script>
                const modelos = [
                    { v: 'V1', price: '$15.000', logo: 'Frente' },
                    { v: 'V2', price: '$15.000', logo: 'Espalda' },
                    { v: 'V3', price: '$16.000', logo: 'Frente/Espalda' },
                    { v: 'V4', price: '$15.000', logo: 'Frente' },
                    { v: 'V5', price: '$15.000', logo: 'Frente' },
                    { v: 'V6', price: '$16.000', logo: 'Frente/Espalda' }
                ];
                modelos.forEach(m => {
                    document.write(`
                        <div class="item">
                            <div class="tag-v">${m.v}</div>
                            <div class="tag-price">${m.price}</div>
                            <div class="tag-logo">${m.logo}</div>
                            <img src="estilo${m.v}.jpg" onerror="this.src='placeholder.jpg'">
                        </div>
                    `);
                });
            </script>
        </div>
    </section>

    <!-- Stock -->
    <section id="stock" class="page page-list">
        <div class="volver" onclick="irA('inicio')">← Volver</div>
        <div class="grid">
            <div class="item" onclick="abrirSwiper(['portada.jpg'])">
                <div class="tag-v">V7</div><div class="tag-price">$12.000</div><div class="tag-logo">Sin logo</div>
            </div>
        </div>
    </section>

    <section id="detalle" class="page">
        <div class="volver" onclick="irA('inicio')">← Volver</div>
        <div class="swiper"><div class="swiper-wrapper" id="slider-content"></div><div class="swiper-pagination"></div></div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        function irA(id) {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById(id).style.display = (id === 'inicio' ? 'flex' : 'block');
        }
        let swiperInstance;
        function abrirSwiper(imgs) {
            const container = document.getElementById('slider-content');
            container.innerHTML = imgs.map(i => `<div class="swiper-slide"><img src="${i}"></div>`).join('');
            irA('detalle');
            if(swiperInstance) swiperInstance.destroy();
            swiperInstance = new Swiper('.swiper', { pagination: { el: '.swiper-pagination', clickable: true } });
        }
    </script>
</body>
</html>
