<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EMM2</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        .page { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; display: none; }
        
        /* UI Inicio */
        #inicio { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
        h1 { font-size: 3rem; margin-bottom: 20px; letter-spacing: 2px; }
        .descripcion { max-width: 400px; margin-bottom: 30px; font-size: 1.1rem; line-height: 1.5; color: #ccc; }
        .btn-container { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 300px; }
        .row-group { display: flex; gap: 10px; align-items: center; }
        .btn { flex-grow: 1; background: #fff; color: #000; padding: 15px; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        .btn-outline { background: transparent; color: #fff; border: 1px solid #fff; }
        .btn-info { width: 45px; height: 45px; border-radius: 50%; border: 1px solid #fff; background: transparent; color: #fff; cursor: pointer; font-weight: bold; flex-shrink: 0; }
        
        /* Grids */
        .page-list { overflow-y: auto; display: none; padding-top: 60px; }
        .grid { display: grid; gap: 20px; max-width: 900px; margin: 0 auto; padding: 20px; grid-template-columns: repeat(3, 1fr); }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
        
        /* Items */
        .item { aspect-ratio: 3/4; border: 2px solid #fff; border-radius: 10px; overflow: hidden; cursor: pointer; position: relative; background: #000; }
        .item img { width: 100%; height: 100%; object-fit: contain; }
        .opaco img { opacity: 0.3; } /* Solo para modelos bloqueados */
        .label, .price, .info { position: absolute; left: 10px; padding: 4px 12px; border: 1.5px solid #fff; border-radius: 6px; font-weight: bold; background: rgba(0,0,0,0.6); z-index: 10; font-size: 14px; }
        .label { top: 10px; } .price { top: 45px; } .info { top: 80px; font-size: 12px; }
        
        .overlay-no { position: absolute; inset: 0; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 20; }
        .modal-box { padding: 15px; border: 1px solid #fff; border-radius: 10px; background: #000; font-size: 12px; text-align: center; }
        .swiper { width: 100vw; height: 100vh; }
        .volver { position: absolute; top: 20px; left: 20px; z-index: 1000; cursor: pointer; background: rgba(0,0,0,0.5); padding: 10px 20px; border: 1px solid #fff; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <section id="inicio" class="page" style="display: flex;">
        <h1>EMM2</h1>
        <p class="descripcion">Remeras 100% algodón, calidad premium en peinado 24.1. Talle M.</p>
        <div class="btn-container">
            <div class="row-group"><button class="btn" onclick="irA('catalogo')">MODELOS</button><button class="btn-info" onclick="irA('info-page')">?</button></div>
            <div class="row-group"><button class="btn btn-outline" onclick="irA('stock')">REMERA</button><button class="btn-info" onclick="alert('Remera básica sin logo ni etiquetas.')">?</button></div>
            <button class="btn btn-outline" onclick="abrirSwiper([{img:'talle_m.jpg.jpeg'}])">TALLE M</button>
        </div>
    </section>

    <section id="info-page" class="page page-list">
        <div class="volver" onclick="irA('inicio')">← Volver</div>
        <div style="max-width: 500px; margin: 0 auto; padding: 20px;">
            <h2>Información</h2>
            <p style="color:#ccc; margin-top:20px;">Las remeras en sección "Remera" son sin logo ni etiquetas. Los "Modelos" son representaciones digitales.</p>
        </div>
    </section>

    <section id="stock" class="page page-list">
        <div class="volver" onclick="irA('inicio')">← Volver</div>
        <div class="grid">
            <div class="item" onclick="abrirSwiper([{img:'frente_real.jpg'},{img:'espalda_real.jpg'}])">
                <div class="label">V7</div><div class="price">$12.000</div><div class="info">sin logo</div>
                <img src="portada_v7.jpg.jpeg"> <!-- Foto de portada para la V7 -->
            </div>
        </div>
    </section>

    <section id="catalogo" class="page page-list">
        <div class="volver" onclick="irA('inicio')">← Volver</div>
        <div class="grid">
            <script>
                [1,2,3,4,5,6].forEach(i => {
                    document.write(`
                        <div class="item opaco">
                            <div class="overlay-no"><div class="modal-box">No disponible<br>por ahora</div></div>
                            <div class="label">V${i}</div><div class="price">$15.000</div><div class="info">Logo</div>
                            <img src="estilo${i}_1.jpg.jpeg">
                        </div>
                    `);
                });
            </script>
        </div>
    </section>

    <section id="detalle" class="page">
        <div class="volver" onclick="irA('inicio')">← Volver</div>
        <div class="swiper"><div class="swiper-wrapper" id="slider-content"></div><div class="swiper-pagination"></div></div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        let mySwiper;
        function irA(id) {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById(id).style.display = (id === 'inicio' ? 'flex' : 'block');
        }
        function abrirSwiper(imagenes) {
            const container = document.getElementById('slider-content');
            container.innerHTML = imagenes.map(img => `<div class="swiper-slide"><div class="swiper-zoom-container"><img src="${img.img}"></div></div>`).join('');
            irA('detalle');
            if(mySwiper) mySwiper.destroy();
            mySwiper = new Swiper('.swiper', { zoom: true, pagination: { el: '.swiper-pagination', clickable: true } });
        }
    </script>
</body>
</html>
